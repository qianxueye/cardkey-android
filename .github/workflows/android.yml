name: Android
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Install pinned loopback CA test tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cardkey-step/ca" "$RUNNER_TEMP/cardkey-step/cli"
          curl -fsSL https://github.com/smallstep/certificates/releases/download/v0.30.2/step-ca_linux_0.30.2_amd64.tar.gz -o "$RUNNER_TEMP/cardkey-step/ca.tar.gz"
          curl -fsSL https://github.com/smallstep/cli/releases/download/v0.31.0/step_linux_0.31.0_amd64.tar.gz -o "$RUNNER_TEMP/cardkey-step/cli.tar.gz"
          tar -xzf "$RUNNER_TEMP/cardkey-step/ca.tar.gz" -C "$RUNNER_TEMP/cardkey-step/ca"
          tar -xzf "$RUNNER_TEMP/cardkey-step/cli.tar.gz" -C "$RUNNER_TEMP/cardkey-step/cli"
          ca_binary=$(find "$RUNNER_TEMP/cardkey-step/ca" -type f -name step-ca)
          cli_binary=$(find "$RUNNER_TEMP/cardkey-step/cli" -type f -name step)
          "$ca_binary" --version | grep -F 'Smallstep CA/0.30.2'
          "$cli_binary" version | grep -F 'Smallstep CLI/0.31.0'
          echo "CARDKEY_STEP_CA=$ca_binary" >> "$GITHUB_ENV"
          echo "CARDKEY_STEP_CLI=$cli_binary" >> "$GITHUB_ENV"
      - name: Build and verify
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --no-daemon
